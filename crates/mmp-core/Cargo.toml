[package]
name = "mmp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Domain model and application services for Macros & Meal Plans"

[features]
testing = []
openapi = ["dep:utoipa"]

[dependencies]
utoipa = { version = "5.5.0", optional = true }
async-trait = "0.1.92"
rust_decimal = { version = "1.42.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["macros", "serde"] }
uuid = { version = "1.25.0", features = ["v5", "v7", "serde"] }

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
